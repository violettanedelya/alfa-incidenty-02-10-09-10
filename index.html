<style>
:root{--page:#EDF0F5;--card:#FFFFFF;--soft:#F3F5F9;--line:#E1E6EE;--ink:#00091A;--ink-2:#3C4658;--ink-3:#5F6B80;--blue:#025BFF;--coral:#FF5630;--coral-ink:#B02C0B;
--display:"Unbounded","Arial Black","Helvetica Neue",Arial,sans-serif;--text:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--page:#05070B;--card:#10141C;--soft:#181D28;--line:#262D3B;--ink:#F2F5FA;--ink-2:#BCC5D3;--ink-3:#8E99AC;--coral-ink:#FF9278;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--text);-webkit-font-smoothing:antialiased}
.box{background:var(--card);border-radius:28px;padding:32px 28px 26px;width:min(420px,100%)}
.mark{display:grid;grid-template-columns:repeat(3,9px);gap:4px;margin-bottom:24px}
.mark b{width:9px;height:9px;border-radius:50%;background:var(--blue)}.mark b:nth-child(n+7){background:var(--coral)}
.eyebrow{font:650 12px/1.2 var(--text);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:10px 0 10px;font:600 clamp(24px,7vw,30px)/1.05 var(--display);letter-spacing:-.04em;text-wrap:balance}
p{margin:0 0 22px;color:var(--ink-2);font-size:14.5px}
label{display:block;font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:8px}
input{width:100%;padding:15px 16px;border:2px solid var(--line);border-radius:18px;background:var(--soft);color:var(--ink);font:600 22px/1.2 var(--display);letter-spacing:.32em;text-align:center}
input:focus{outline:none;border-color:var(--blue)}
button{width:100%;margin-top:12px;padding:16px 18px;border:0;border-radius:999px;background:var(--ink);color:var(--card);font:650 15px/1.2 var(--text);cursor:pointer;transition:transform .2s cubic-bezier(.16,1,.3,1)}
button:hover{transform:translateY(-2px)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.err{min-height:21px;margin-top:12px;font-size:13.5px;font-weight:650;color:var(--coral-ink);text-align:center}
.foot{margin-top:14px;font-size:12.5px;line-height:1.4;color:var(--ink-3);display:flex;gap:8px;align-items:center;justify-content:center}
.foot svg{flex:none}
@media (prefers-reduced-motion:reduce){button{transition:none}}

  for(var i=0;i<ss.length;i++){var o=ss[i],n=document.createElement('script');
    for(var j=0;j<o.attributes.length;j++)n.setAttribute(o.attributes[j].name,o.attributes[j].value);
    n.textContent=o.textContent;o.parentNode.replaceChild(n,o);}
  window.scrollTo(0,0);
}
async function go(ev){
  if(ev)ev.preventDefault();if(busy)return;
  var e=document.getElementById('e'),b=document.getElementById('b'),p=document.getElementById('p');
  if(!window.crypto||!crypto.subtle){e.textContent='Откройте страницу по адресу, который начинается с https';return}
  busy=true;e.textContent='';b.textContent='Открываю…';
  var html=null;
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p.value),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(SALT),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(IV)},k,d(CT));
    html=new TextDecoder().decode(pt);
  }catch(x){busy=false;b.textContent='Открыть';e.textContent='Неверный пароль';p.select();return}
  show(html);
}
document.getElementById('f').addEventListener('submit',go);
</script></body></html>
